    branch: main
    commit: "aafaefdb"
    scope: [mongodb-groceries-agent/agent.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:33:52Z'
    url: https://a2as.org/certified/agents/mongodb-developer/mongodb-adk-agents
  signatures:
    digest: sha256:OF0d98t5kiPQfrJK10Uwus_Zy7aETOo1kV8gYGGlSkQ
    key: ed25519:zWvWIw38bXVZLa_jfPgQRUcaKDXQWcTiIN2f6kLDpPc
    sig: ed25519:WzaKO9_sbVljIrnbH45CFKo_nh_qGHkDhIC_-l87wZUTBgTwR0baSGMSxGmGkglIC9XuukFeAzigY1rzf8iaBA

agents:
  root_agent:
    type: instance
    models: [gemini-2.5-flash]
    tools: [find_similar_products, add_to_cart, calculate_cart_total]
    params:
      name: grocery_shopping_agent
      instruction: ['You are the **Online Groceries Agent**, a friendly and helpful virtual assistant for our e-commerce grocery
          store.', 'Start every conversation with a warm greeting, introduce yourself as the "Online Groceries Agent," and
          ask how you can assist the user today.', Your role is to guide customers through their shopping experience., 'What
          you can do:', '- Help users discover and explore products in the store.', '- Suggest alternatives when the exact
          item is not available.', '- Add products to the user’s shopping cart.', '- Answer product-related questions in a
          clear and concise way.', '- Return the total in the user’s shopping cart.', 'Available tools:', '1. **find_similar_products**:
          Search for products with names semantically similar to the user’s request.', '2. **add_to_cart**: Add a product
          to the user’s cart in MongoDB. Pass only the product name (as it appears in the inventory collection) and the user’s
          username.', '3. **calculate_cart_total**: Sum the total of all products in a user''s cart and return it. Pass the
          user’s username.', 'Core guidelines:', '- **Always search first**: If a user asks for a product, call `find_similar_products`
          before attempting to add it to the cart.', '- **Handle missing products**: If the requested product is not in the
          inventory, suggest similar items returned by the search.', '- **Parallel tool use**: You may call multiple tools
          in parallel when appropriate (e.g., searching for several items at once).', '- **Clarify only when necessary**:
          Ask for more details if the request is unclear and you cannot perform a search.', '- Keep your tone positive, approachable,
          and customer-focused throughout the interaction.', 'Additional important instructions:', '- **Do not assume availability**:
          Never add a product directly to the cart without confirming it exists in the inventory.', '- **Respect exact names**:
          When using `add_to_cart`, pass the product name exactly as stored in the inventory collection.', '- **Multi-item
          requests**: If the user asks for several items in one message, search for all items together and suggest results
          before adding to the cart.', '- **Quantity requests**: If the user specifies a quantity, repeat it back to confirm
          and ensure it is respected when adding to the cart.', '- **Cart confirmation**: After adding items, confirm with
          the user that they have been successfully added.', '- **Fallback behavior**: If no results are found, apologize
          politely, and encourage the user to try a different product or category.', '- **Stay focused**: Only handle product
          discovery, shopping, and cart management tasks. Politely decline requests unrelated to groceries.', '- **Answering
          product questions**: If the question is about a product (e.g., "Is this organic?" or "How much does it cost?"),
          use the search results to answer. If the information is not available, respond transparently that you don’t have
          that detail.', 'Remember: you are a professional yet friendly shopping assistant whose goal is to make the user’s
          grocery shopping smooth, efficient, and enjoyable.']

models:
  gemini-2.5-flash:
    type: literal
    agents: [root_agent]

tools:
  add_to_cart:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Add a product to the user's cart in MongoDB.
        This function retrieves the product from the inventory collection and adds it to the user's cart.
        Args:
          product: The name of the product to add. The product name should match the name in the inventory collection.
          username: The name of the user.

        Returns:
          Success or failure message.
  calculate_cart_total:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Calculates the total price of all products in the user cart.
        This function retrieves the user cart from the carts collection and sums their price to return a total.
        Args:
          username: The name of the user.

        Returns:
          Total price
  find_similar_products:
    type: function
    agents: [root_agent]
    params:
      description: |-
        Searches for products with a product name semantically similar to a given product.
        Returns a list of three similar products along with their project IDs.

        Args:
            query: A string containing the user's query about ecommerce products.
                This can be a product name, description, or any other relevant information related to the
                products in the ecommerce database.
        Example:
            query = "organic apples"
        Example:
            query = "sweet treats"
        Returns:
            A list of dictionaries, each containing the product name and other relevant details.

imports:
  agent: agent
  Agent: google.adk.agents.Agent
  certifi: certifi
  genai: google.genai
  os: os
  pymongo: pymongo
  types: google.genai.types

functions:
  add_to_cart:
    type: sync
    module: mongodb-groceries-agent.agent
    args: [product, username]
    params:
      returns: str
  calculate_cart_total:
    type: sync
    module: mongodb-groceries-agent.agent
    args: [username]
    params:
      returns: str
  find_similar_products:
    type: sync
    module: mongodb-groceries-agent.agent
    args: [query]
    params:
      returns: str
  generate_embeddings:
    type: sync
    module: mongodb-groceries-agent.agent
    args: [query]

variables:
  CONNECTION_STRING:
    type: env
    params:
      caller: [os.environ.get]
      path: [mongodb-groceries-agent.agent]
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.environ.get]
      path: [mongodb-groceries-agent.agent]
