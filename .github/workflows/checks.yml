name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  solutions-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The solutions are generated from agent.py. This fails if someone edits
      # one directly, or changes agent.py without regenerating.
      - run: python3 workshop/generate_solutions.py --check

  starter-placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The starter files are the lab's exercise; losing a placeholder means
      # shipping an answer. The counts here are the exercise itself.
      - name: starter files still have their placeholders
        run: |
          set -eu
          agent=$(grep -c '<[A-Z_ ]*>' workshop/starter/agent.py)
          index=$(grep -c '<[A-Z_]*>' workshop/starter/create-vector-search-index.py)
          echo "agent.py: $agent placeholder(s), create-vector-search-index.py: $index"
          test "$agent" -ge 1
          test "$index" -ge 6

  no-placeholders-in-shipped-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tutorial path must be runnable as-is.
      - run: |
          set -eu
          if grep -rn '<[A-Z_]\{3,\}>' mongodb_groceries_agent/; then
            echo "mongodb_groceries_agent/ must not contain placeholders" >&2
            exit 1
          fi
          echo "no placeholders in mongodb_groceries_agent/"

  credentials-before-use:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # set_env(PASSKEY) is what puts GOOGLE_API_KEY in the environment, and
      # genai.Client() raises without it. Anything that builds a client before
      # that call makes the agent fail to import, which surfaces as a 404 on
      # /run_sse rather than anything that points at the cause.
      - run: |
          python3 - <<'PY'
          import pathlib, sys
          bad = []
          for f in sorted(pathlib.Path("workshop/solutions").glob("*.py")):
              text = f.read_text()
              if "genai.Client(" not in text:
                  continue
              if "set_env(" not in text:
                  bad.append(f"{f}: builds a client but never calls set_env")
              elif text.index("genai.Client(") < text.index("set_env("):
                  bad.append(f"{f}: builds a client before set_env")
          for b in bad:
              print(b, file=sys.stderr)
          sys.exit(1 if bad else 0)
          PY

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python3 -m compileall -q mongodb_groceries_agent workshop/solutions
          python3 -m compileall -q workshop/generate_solutions.py
